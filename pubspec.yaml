name: muyes
description: "Muyes - tracker makan, eek, dan mules. Local-first, no account, no cloud."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.2.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  sqlite3: ^3.9.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/streamline/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/fredoka-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito-400.ttf
          weight: 400
        - asset: assets/fonts/nunito-600.ttf
          weight: 600
        - asset: assets/fonts/nunito-700.ttf
          weight: 700
